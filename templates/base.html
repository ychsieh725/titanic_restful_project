<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Titanic ML 平台{% endblock %}</title>
    <style>
        :root {
            --bg: #f6f7f9;
            --fg: #1f2933;
            --muted: #6b7280;
            --line: #d8dee4;
            --brand: #2563eb;
            --ok: #15803d;
            --bad: #b91c1c;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, "Helvetica Neue", sans-serif;
            margin: 0;
            color: var(--fg);
            background: var(--bg);
        }

        nav {
            display: flex;
            gap: 4px;
            align-items: center;
            padding: 12px 24px;
            background: #fff;
            border-bottom: 1px solid var(--line);
        }

        nav .brand {
            font-weight: 700;
            /* 把品牌留在左側，其餘連結推到右側 */
            margin-right: auto;
        }

        nav a {
            padding: 6px 12px;
            border-radius: 6px;
            text-decoration: none;
            color: var(--fg);
            /* 預留與 active 底線等高的透明邊框，避免切換時版面跳動 */
            border-bottom: 2px solid transparent;
        }

        nav a:hover {
            background: var(--bg);
        }

        nav a.active {
            color: var(--brand);
            font-weight: 600;
            border-bottom-color: var(--brand);
            border-radius: 0;
        }

        main {
            max-width: 880px;
            margin: 24px auto;
            padding: 0 24px;
        }

        h1 {
            font-size: 1.5rem;
        }

        .card {
            background: #fff;
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-top: 12px;
            font-size: 0.9rem;
            color: var(--muted);
        }

        input,
        select {
            padding: 8px;
            width: 100%;
            max-width: 320px;
            border: 1px solid var(--line);
            border-radius: 6px;
            margin-top: 4px;
        }

        button {
            margin-top: 16px;
            padding: 9px 18px;
            border: none;
            border-radius: 30px;
            background: var(--brand);
            color: #fff;
            cursor: pointer;
            white-space: nowrap;
        }

        button:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }

        /* 表格內的操作按鈕：去除版面用的上邊距、縮小內距 */
        td button {
            margin-top: 0;
            padding: 4px 10px;
        }

        /* 危險操作（如刪除）用紅色 */
        button.danger {
            background: var(--bad);
        }

        /* 並排操作按鈕 */
        .actions {
            display: flex;
            gap: 6px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 12px;
            font-size: 0.9rem;
        }

        th,
        td {
            border: 1px solid var(--line);
            padding: 6px 8px;
            text-align: left;
        }

        th {
            background: var(--bg);
            white-space: nowrap;
        }

        /* 連結樣式化為按鈕（可套在 <a> 上，與 <button> 視覺一致） */
        .btn {
            display: inline-block;
            padding: 9px 18px;
            border-radius: 30px;
            background: var(--brand);
            color: #fff;
            text-decoration: none;
            cursor: pointer;
        }

        .btn:hover {
            opacity: 0.92;
        }

        .muted {
            color: var(--muted);
        }

        .ok {
            color: var(--ok);
        }

        .bad {
            color: var(--bad);
        }

        pre {
            background: var(--bg);
            border: 1px solid var(--line);
            border-radius: 6px;
            padding: 12px;
            overflow: auto;
        }
    </style>
    {% block head %}{% endblock %}
</head>

<body>
    <nav>
        <span class="brand">Titanic ML</span>
        <a href="/"{% if active_page == 'home' %} class="active"{% endif %}>首頁</a>
        <a href="/ml/train"{% if active_page == 'train' %} class="active"{% endif %}>訓練</a>
        <a href="/ml/models"{% if active_page == 'models' %} class="active"{% endif %}>模型</a>
        <a href="/ml/predict"{% if active_page == 'predict' %} class="active"{% endif %}>預測</a>
    </nav>

    <main>
        {% block content %}{% endblock %}
    </main>

    {% block scripts %}{% endblock %}
</body>

</html>
