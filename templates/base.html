<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Titanic ML 平台{% endblock %}</title>
    <style>
        :root {
            --fg: #1f2933;
            --muted: #6b7280;
            --line: #e5e7eb;
            --panel: #f4f5f7;
            --brand: #2563eb;
            --ok: #15803d;
            --bad: #b91c1c;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, "Helvetica Neue", sans-serif;
            margin: 0;
            color: var(--fg);
            background: #fff;
        }

        /* --- App shell：頂部列 + 左側邊欄 + 主內容 --- */
        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 16px 28px;
            background: #fff;
            border-bottom: 1px solid var(--line);
        }

        .topbar .brand {
            font-weight: 800;
            font-size: 1.25rem;
            letter-spacing: 0.5px;
        }

        .topbar-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .shell {
            display: flex;
            align-items: flex-start;
        }

        .sidebar {
            width: 180px;
            flex-shrink: 0;
            padding: 20px 12px;
        }

        .sidebar nav {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .sidebar nav a {
            padding: 10px 18px;
            border-radius: 30px;
            text-decoration: none;
            color: var(--fg);
            font-weight: 500;
            text-align: center;
        }

        .sidebar nav a:hover {
            background: var(--panel);
        }

        .sidebar nav a.active {
            background: var(--panel);
            font-weight: 700;
        }

        main {
            flex: 1;
            min-width: 0;
            max-width: 1200px;
            padding: 24px 28px 48px;
        }

        h1 {
            font-size: 1.5rem;
        }

        .card {
            background: var(--panel);
            border-radius: 16px;
            padding: 22px;
            margin-bottom: 20px;
        }

        /* 窄版容器（如表單頁），置中不佔滿整個內容寬度 */
        .narrow {
            max-width: 560px;
            margin-left: auto;
            margin-right: auto;
        }

        label {
            display: block;
            margin-top: 12px;
            font-size: 0.9rem;
            color: var(--muted);
        }

        input,
        select {
            padding: 8px 12px;
            width: 100%;
            max-width: 320px;
            background: #fff;
            border: 1px solid var(--line);
            border-radius: 8px;
            margin-top: 4px;
        }

        textarea {
            width: 100%;
            padding: 10px 12px;
            background: #fff;
            border: 1px solid var(--line);
            border-radius: 8px;
            margin-top: 4px;
            font-family: inherit;
            font-size: 0.95rem;
            resize: vertical;
            min-height: 90px;
        }

        /* 兩欄表單版面（design system 表單） */
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px 20px;
        }

        .field {
            display: flex;
            flex-direction: column;
        }

        .field.full {
            grid-column: 1 / -1;
        }

        .field label {
            margin: 0 0 6px;
            font-weight: 700;
            color: var(--fg);
            font-size: 0.92rem;
        }

        .field input,
        .field select,
        .field textarea {
            max-width: none;
            margin-top: 0;
        }

        button {
            margin-top: 16px;
            padding: 9px 18px;
            border: none;
            border-radius: 30px;
            background: var(--brand);
            color: #fff;
            cursor: pointer;
            white-space: nowrap;
        }

        /* 全寬主要按鈕（表單送出） */
        .btn-block {
            width: 100%;
            text-align: center;
        }

        button:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }

        /* 表格內的操作按鈕：去除版面用的上邊距、縮小內距 */
        td button {
            margin-top: 0;
            padding: 4px 10px;
        }

        /* 危險操作（如刪除）用紅色 */
        button.danger {
            background: var(--bad);
        }

        /* 並排操作按鈕 */
        .actions {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        /* 圖示按鈕：透明底、hover 才上色（編輯/刪除等行內操作） */
        .icon-btn {
            margin-top: 0;
            padding: 7px;
            background: transparent;
            color: var(--muted);
            border-radius: 8px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .icon-btn:hover {
            background: var(--panel);
            color: var(--fg);
        }

        .icon-btn.danger {
            background: transparent;
            color: var(--muted);
        }

        .icon-btn.danger:hover {
            background: #fee2e2;
            color: var(--bad);
        }

        .icon-btn svg {
            width: 18px;
            height: 18px;
            display: block;
        }

        /* 狀態膠囊標籤 */
        .badge {
            display: inline-block;
            padding: 3px 12px;
            border-radius: 30px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .badge-success {
            background: #dcfce7;
            color: var(--ok);
        }

        .badge-danger {
            background: #fee2e2;
            color: var(--bad);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 12px;
            font-size: 0.9rem;
        }

        th,
        td {
            padding: 12px 14px;
            text-align: left;
            border-bottom: 1px solid var(--line);
        }

        th {
            white-space: nowrap;
            color: var(--muted);
            font-weight: 600;
            font-size: 0.82rem;
        }

        tbody tr:hover {
            background: rgba(0, 0, 0, 0.02);
        }

        /* 連結樣式化為按鈕（可套在 <a> 上，與 <button> 視覺一致） */
        .btn {
            display: inline-block;
            padding: 9px 18px;
            border-radius: 30px;
            background: var(--brand);
            color: #fff;
            text-decoration: none;
            cursor: pointer;
        }

        .btn:hover {
            opacity: 0.92;
        }

        .muted {
            color: var(--muted);
        }

        .ok {
            color: var(--ok);
        }

        .bad {
            color: var(--bad);
        }

        pre {
            background: #fff;
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 12px;
            overflow: auto;
        }

        @media (max-width: 640px) {
            .sidebar {
                width: 96px;
                padding: 16px 8px;
            }

            .sidebar nav a {
                padding: 10px 12px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
    {% block head %}{% endblock %}
</head>

<body>
    <header class="topbar">
        <span class="brand">TITANIC ML</span>
        <div class="topbar-right">{% block topbar_right %}{% endblock %}</div>
    </header>

    <div class="shell">
        <aside class="sidebar">
            <nav>
                <a href="/"{% if active_page == 'home' %} class="active"{% endif %}>DATAS</a>
                <a href="/ml/train"{% if active_page == 'train' %} class="active"{% endif %}>TRAIN</a>
                <a href="/ml/models"{% if active_page == 'models' %} class="active"{% endif %}>MODELS</a>
                <a href="/ml/predict"{% if active_page == 'predict' %} class="active"{% endif %}>PREDICT</a>
            </nav>
        </aside>

        <main>
            {% block content %}{% endblock %}
        </main>
    </div>

    {% block scripts %}{% endblock %}
</body>

</html>
