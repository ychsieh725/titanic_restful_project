<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Titanic ML 平台{% endblock %}</title>
    <style>
        :root {
            --fg: #1f2933;
            --muted: #6b7280;
            --line: #e5e7eb;
            --panel: #f4f5f7;
            --brand: #2563eb;
            --ok: #15803d;
            --bad: #b91c1c;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, "Helvetica Neue", sans-serif;
            margin: 0;
            color: var(--fg);
            background: #fff;
            /* 首頁 hero 用 100vw 滿版，避免多出橫向捲軸 */
            overflow-x: hidden;
        }

        /* --- App shell：頂部導覽列 + 主內容 --- */
        .topbar {
            display: flex;
            align-items: center;
            gap: 20px;
            height: 58px;
            padding: 0 28px;
            background: #fff;
            border-bottom: 1px solid var(--line);
        }

        .topbar .brand {
            flex: 1;
            font-weight: 800;
            font-size: 1.25rem;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }

        /* 頂部水平導覽（置中：兩側 flex:1 撐開讓 nav 落在正中） */
        .topnav {
            display: flex;
            align-items: center;
            gap: 24px;
            flex-wrap: wrap;
        }

        .topnav a {
            padding: 8px 4px;
            text-decoration: none;
            color: var(--fg);
            font-weight: 500;
            /* 預留透明底線，切換 active 時不位移 */
            border-bottom: 2px solid transparent;
        }

        .topnav a:hover {
            color: var(--brand);
        }

        .topnav a.active {
            font-weight: 700;
            border-bottom-color: var(--brand);
        }

        .topbar-right {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 8px;
        }

        /* 漢堡選單按鈕：桌機隱藏，手機顯示（覆寫全域 button 樣式） */
        .nav-toggle {
            display: none;
            margin-top: 0;
            padding: 8px;
            background: transparent;
            color: var(--fg);
            border: none;
            cursor: pointer;
            align-items: center;
            justify-content: center;
        }

        .nav-toggle svg {
            width: 26px;
            height: 26px;
        }

        main {
            max-width: 1200px;
            margin: 0 auto;
            padding: 24px 28px 48px;
        }

        h1 {
            font-size: 1.5rem;
        }

        .card {
            background: var(--panel);
            border-radius: 16px;
            padding: 22px;
            margin-bottom: 20px;
        }

        /* 窄版容器（如表單頁），置中不佔滿整個內容寬度 */
        .narrow {
            max-width: 560px;
            margin-left: auto;
            margin-right: auto;
        }

        label {
            display: block;
            margin-top: 12px;
            font-size: 0.9rem;
            color: var(--muted);
        }

        input,
        select {
            padding: 8px 12px;
            width: 100%;
            max-width: 320px;
            background: #fff;
            border: 1px solid var(--line);
            border-radius: 8px;
            margin-top: 4px;
        }

        textarea {
            width: 100%;
            padding: 10px 12px;
            background: #fff;
            border: 1px solid var(--line);
            border-radius: 8px;
            margin-top: 4px;
            font-family: inherit;
            font-size: 0.95rem;
            resize: vertical;
            min-height: 90px;
        }

        /* 兩欄表單版面（design system 表單） */
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px 20px;
        }

        .field {
            display: flex;
            flex-direction: column;
        }

        .field.full {
            grid-column: 1 / -1;
        }

        .field label {
            margin: 0 0 6px;
            font-weight: 700;
            color: var(--fg);
            font-size: 0.92rem;
        }

        /* 欄位 label 的中文輔助說明（接在英文後） */
        .field label .zh {
            margin-left: 6px;
            font-weight: 400;
            color: var(--muted);
            font-size: 0.85em;
        }

        .field input,
        .field select,
        .field textarea {
            max-width: none;
            margin-top: 0;
        }

        button {
            margin-top: 16px;
            padding: 9px 18px;
            border: none;
            border-radius: 30px;
            background: var(--brand);
            color: #fff;
            cursor: pointer;
            white-space: nowrap;
        }

        /* 全寬主要按鈕（表單送出） */
        .btn-block {
            width: 100%;
            text-align: center;
        }

        button:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }

        /* 表格內的操作按鈕：去除版面用的上邊距、縮小內距 */
        td button {
            margin-top: 0;
            padding: 4px 10px;
        }

        /* 危險操作（如刪除）用紅色 */
        button.danger {
            background: var(--bad);
        }

        /* 並排操作按鈕 */
        .actions {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        /* 圖示按鈕：透明底、hover 才上色（編輯/刪除等行內操作） */
        .icon-btn {
            margin-top: 0;
            padding: 7px;
            background: transparent;
            color: var(--muted);
            border-radius: 8px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .icon-btn:hover {
            background: var(--panel);
            color: var(--fg);
        }

        .icon-btn.danger {
            background: transparent;
            color: var(--muted);
        }

        .icon-btn.danger:hover {
            background: #fee2e2;
            color: var(--bad);
        }

        .icon-btn svg {
            width: 18px;
            height: 18px;
            display: block;
        }

        /* 狀態膠囊標籤 */
        .badge {
            display: inline-block;
            padding: 3px 12px;
            border-radius: 30px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .badge-success {
            background: #dcfce7;
            color: var(--ok);
        }

        .badge-danger {
            background: #fee2e2;
            color: var(--bad);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 12px;
            font-size: 0.9rem;
        }

        th,
        td {
            padding: 12px 14px;
            text-align: left;
            border-bottom: 1px solid var(--line);
        }

        th {
            white-space: nowrap;
            color: var(--muted);
            font-weight: 600;
            font-size: 0.82rem;
        }

        tbody tr:hover {
            background: rgba(0, 0, 0, 0.02);
        }

        /* 欄位多的表格於窄視窗改橫向捲動，避免溢出被裁切（body 為 overflow-x:hidden）*/
        .table-scroll {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        /* 保底寬度：手機上不壓縮欄位，改以橫向拖拉檢視 */
        .table-scroll table {
            min-width: 680px;
        }

        /* 連結樣式化為按鈕（可套在 <a> 上，與 <button> 視覺一致） */
        .btn {
            display: inline-block;
            padding: 9px 18px;
            border-radius: 30px;
            background: var(--brand);
            color: #fff;
            text-decoration: none;
            cursor: pointer;
        }

        .btn:hover {
            opacity: 0.92;
        }

        .muted {
            color: var(--muted);
        }

        .ok {
            color: var(--ok);
        }

        .bad {
            color: var(--bad);
        }

        pre {
            background: #fff;
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 12px;
            overflow: auto;
        }

        @media (max-width: 640px) {
            .topbar {
                padding: 0 16px;
                position: relative;
            }

            .topbar .brand {
                flex: 0 0 auto;
            }

            /* 漢堡按鈕靠右；隱藏桌機用的 topbar-right 佔位撐開 */
            .nav-toggle {
                display: inline-flex;
                margin-left: auto;
            }

            .topbar-right {
                flex: 0 0 auto;
            }

            /* 導覽收合成下拉面板：預設隱藏，.open 時展開 */
            .topnav {
                display: none;
                position: absolute;
                top: 58px;
                left: 0;
                right: 0;
                flex-direction: column;
                align-items: stretch;
                gap: 0;
                background: #fff;
                border-bottom: 1px solid var(--line);
                padding: 6px 0;
                box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
                z-index: 20;
            }

            .topnav.open {
                display: flex;
            }

            /* 直式清單：底線改回無，當前頁以底色 + 主色標示 */
            .topnav a {
                padding: 12px 20px;
                border-bottom: none;
            }

            .topnav a.active {
                border-bottom: none;
                color: var(--brand);
                background: var(--panel);
            }

            .form-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
    {% block head %}{% endblock %}
</head>

<body>
    <header class="topbar">
        <span class="brand">TITANIC ML</span>
        <button class="nav-toggle" type="button" aria-label="開啟導覽選單" aria-expanded="false"
            aria-controls="topnav">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <line x1="3" y1="6" x2="21" y2="6" />
                <line x1="3" y1="12" x2="21" y2="12" />
                <line x1="3" y1="18" x2="21" y2="18" />
            </svg>
        </button>
        <nav class="topnav" id="topnav">
            <a href="/"{% if active_page == 'home' %} class="active"{% endif %}>HOME</a>
            <a href="/passengers"{% if active_page == 'datas' %} class="active"{% endif %}>DATAS</a>
            <a href="/ml/train"{% if active_page == 'train' %} class="active"{% endif %}>TRAIN</a>
            <a href="/ml/models"{% if active_page == 'models' %} class="active"{% endif %}>MODELS</a>
            <a href="/ml/predict"{% if active_page == 'predict' %} class="active"{% endif %}>PREDICT</a>
        </nav>
        <div class="topbar-right">{% block topbar_right %}{% endblock %}</div>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <!-- 漢堡選單開合（RWD）：切換 .open 並同步 aria-expanded -->
    <script>
        (function () {
            var toggle = document.querySelector(".nav-toggle");
            var nav = document.getElementById("topnav");
            if (!toggle || !nav) return;
            toggle.addEventListener("click", function () {
                var isOpen = nav.classList.toggle("open");
                toggle.setAttribute("aria-expanded", isOpen ? "true" : "false");
            });
        })();
    </script>

    {% block scripts %}{% endblock %}
</body>

</html>
