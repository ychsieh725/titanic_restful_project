{% extends "base.html" %}

{% block title %}乘客資料管理 — Titanic ML{% endblock %}

{% block head %}
<style>
    .content-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        flex-wrap: wrap;
        margin-bottom: 8px;
    }

    .content-head h1 {
        margin: 0;
    }

    /* 頂部搜尋框 */
    .search-box {
        margin-top: 0;
        width: 240px;
    }

    .search-btn {
        margin-top: 0;
        padding: 8px;
        background: var(--panel);
        color: var(--muted);
        display: inline-flex;
        align-items: center;
        justify-content: center;
    }

    .search-btn:hover {
        color: var(--fg);
    }

    .search-btn svg {
        width: 18px;
        height: 18px;
        display: block;
    }

    /* 分頁列：置中、按鈕較小 */
    .pagination {
        display: flex;
        gap: 8px;
        align-items: center;
        justify-content: center;
        margin-top: 18px;
        flex-wrap: wrap;
    }

    .pagination button {
        margin-top: 0;
        padding: 7px 16px;
    }

    .pagination input {
        width: 64px;
        margin-top: 0;
        text-align: center;
    }
</style>
{% endblock %}

{% block topbar_right %}
<input type="text" id="searchInput" class="search-box" placeholder="search name"
    onkeydown="if (event.key === 'Enter') loadPassengers(1)">
<button type="button" class="search-btn" title="搜尋" onclick="loadPassengers(1)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
        stroke-linejoin="round">
        <circle cx="11" cy="11" r="7" />
        <line x1="21" y1="21" x2="16.65" y2="16.65" />
    </svg>
</button>
{% endblock %}

{% block content %}
<div class="content-head">
    <h1>乘客資料管理</h1>
    <a class="btn" href="/passengers/new">＋ 新增乘客</a>
</div>
<p id="summary" class="muted"></p>

<div class="card">
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>姓名</th>
                <th>性別</th>
                <th>年齡</th>
                <th>艙等</th>
                <th>是否生還</th>
                <th>票價</th>
                <th>登船港口</th>
                <th style="text-align:right;">操作</th>
            </tr>
        </thead>
        <tbody id="passengerTableBody"></tbody>
    </table>

    <div class="pagination">
        <button type="button" id="firstBtn" onclick="goToPage(1)">第一頁</button>
        <button type="button" id="prevBtn" onclick="goToPage(currentPage - 1)">上一頁</button>
        <span class="muted">第</span>
        <input type="number" id="pageInput" min="1"
            onkeydown="if (event.key === 'Enter') jumpToInput()">
        <span class="muted">頁 / 共 <span id="totalPages">0</span> 頁</span>
        <button type="button" onclick="jumpToInput()">跳轉</button>
        <button type="button" id="nextBtn" onclick="goToPage(currentPage + 1)">下一頁</button>
        <button type="button" id="lastBtn" onclick="goToPage(getTotalPages())">最後一頁</button>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    // 定義全域變數 currentPage、perPage 和 total，
    // 分別用來記錄目前的頁碼、每頁顯示的資料筆數，以及資料的總筆數。
    let currentPage = 1;
    const perPage = 20;
    let total = 0;

    // 定義一個名為 loadPassengers 的非同步函式，接受一個 page 參數，預設值為 1。
    async function loadPassengers(page = 1) {
        // 取得目前的頁碼，並把它存到 currentPage 變數中。
        currentPage = page;

        // 取得搜尋輸入框的值，存到 search 變數中。
        const search = document.getElementById("searchInput").value;

        // 使用 URLSearchParams 來建立查詢字串，包含 page、per_page 和 search 三個參數。
        // 這裡的查詢字串就是 Query String，會被附加在 URL 的後面，傳遞給後端 API。
        const params = new URLSearchParams({
            page: currentPage,
            per_page: perPage,
            search: search
        });

        // 使用 fetch API 來向後端 API 發送 GET 請求，URL 包含剛剛建立的查詢字串
        const response = await fetch(`/api/passengers?${params.toString()}`);

        // 當你需要更精確的錯誤訊息時，再加上 response.status 判斷即可，
        // 目前可以使用 response.ok 來判斷是否成功讀取資料，
        // 它通常會回傳 true 或 false，根據 HTTP 狀態碼來判斷是否成功，
        // HTTP status code 200-299 代表成功，其他則代表失敗。
        if (!response.ok) {
            alert("讀取資料失敗");
            return;
        }

        // 如果成功讀取資料，我們就把回傳的 JSON 格式資料解析出來，存到 data 變數中
        const data = await response.json();

        // 把 data 中的 total 屬性存到全域變數 total 中，得知資料的總筆數
        total = data.total;

        // 把資料顯示在表格
        renderTable(data.items);

        // 更新分頁資訊
        renderPagination(data.page, data.per_page, data.total);
    }

    // 定義一個名為 renderTable 的函式，接受一個 items 參數，
    // 這個參數是一個陣列，包含了要顯示在表格中的資料
    function renderTable(items) {
        const tbody = document.getElementById("passengerTableBody");
        tbody.innerHTML = "";

        for (const item of items) {
            const tr = document.createElement("tr");

            const survivedBadge = item.Survived === 1
                ? '<span class="badge badge-success">生還</span>'
                : '<span class="badge badge-danger">未生還</span>';

            tr.innerHTML = `
                <td>${item.PassengerId}</td>
                <td>${item.Name}</td>
                <td>${item.Sex}</td>
                <td>${item.Age ?? "—"}</td>
                <td>${item.Pclass}</td>
                <td>${survivedBadge}</td>
                <td>${item.Fare}</td>
                <td>${item.Embarked ?? "—"}</td>
                <td>
                    <div class="actions" style="justify-content:flex-end;">
                        <button type="button" class="icon-btn" title="編輯"
                            onclick="location.href='/passengers/${item.PassengerId}/edit'">
                            ${ICON_EDIT}
                        </button>
                        <button type="button" class="icon-btn danger" title="刪除"
                            onclick="deletePassenger(${item.PassengerId})">
                            ${ICON_DELETE}
                        </button>
                    </div>
                </td>
            `;

            tbody.appendChild(tr);
        }
    }

    // 行內操作圖示（feather 風格）：編輯=鉛筆、刪除=垃圾桶。
    const ICON_EDIT = `
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 20h9" />
            <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z" />
        </svg>`;

    const ICON_DELETE = `
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <polyline points="3 6 5 6 21 6" />
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
        </svg>`;

    // 計算總頁數（至少 1 頁，避免無資料時除出 0）。
    function getTotalPages() {
        return Math.max(1, Math.ceil(total / perPage));
    }

    // 跳到指定頁：超出範圍時自動夾到 [1, 總頁數]，再載入該頁。
    function goToPage(page) {
        const target = Math.min(Math.max(page, 1), getTotalPages());
        loadPassengers(target);
    }

    // 讀取頁碼輸入框的值並跳轉；非數字則忽略。
    function jumpToInput() {
        const value = parseInt(document.getElementById("pageInput").value, 10);
        if (Number.isNaN(value)) {
            return;
        }
        goToPage(value);
    }

    // 顯示分頁資訊：更新總頁數、輸入框預設值，並依邊界停用首尾/上下頁按鈕。
    function renderPagination(page, perPage, total) {
        const totalPages = getTotalPages();

        document.getElementById("summary").textContent = `共有 ${total} 筆資料`;
        document.getElementById("totalPages").textContent = totalPages;
        document.getElementById("pageInput").value = page;

        document.getElementById("firstBtn").disabled = page <= 1;
        document.getElementById("prevBtn").disabled = page <= 1;
        document.getElementById("nextBtn").disabled = page >= totalPages;
        document.getElementById("lastBtn").disabled = page >= totalPages;
    }

    // 刪除的乘客 (透過 passengerId)。
    async function deletePassenger(passengerId) {
        // 在刪除之前，先顯示一個確認對話框，詢問使用者是否確定要刪除這筆資料
        const confirmed = confirm(`確定要刪除 PassengerId=${passengerId} 嗎？`);

        // 如果使用者點擊「取消」，就直接回傳，不執行刪除操作
        if (!confirmed) {
            return;
        }

        // 請求刪除乘客
        const response = await fetch(`/api/passengers/${passengerId}`, {
            method: "DELETE"
        });

        // 取得回傳的 JSON 格式資料，存到 result 變數中
        const result = await response.json()

        // 如果刪除失敗，會回傳一個 error 屬性，顯示錯誤訊息給使用者
        if (!response.ok) {
            alert(result.error || "刪除失敗");
            return;
        }

        alert("刪除成功");

        // 刪除成功後，重新載入目前頁碼的資料，使用者可以看到最新的資料列表
        loadPassengers(currentPage);
    }

    // 頁面載入完成後，會自動載入第一頁的資料
    loadPassengers();
</script>
{% endblock %}
