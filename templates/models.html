{% extends "base.html" %}

{% block title %}模型管理 — Titanic ML{% endblock %}

{% block content %}
<h1>模型管理</h1>

<div class="card">
    <p class="muted">所有已訓練模型。預測一律使用標記為 <strong>active</strong> 的模型；同一時間至多一個 active。</p>
    <button id="refreshBtn" type="button">重新整理</button>
    <p id="emptyHint" class="muted" hidden>尚無模型，請先到「訓練」頁訓練一個。</p>
    <p id="errorBox" class="bad" hidden></p>

    <table id="modelsTable" hidden>
        <thead>
            <tr>
                <th>ID</th>
                <th>演算法</th>
                <th>CV 分數</th>
                <th>Accuracy</th>
                <th>建立時間</th>
                <th>狀態</th>
                <th></th>
            </tr>
        </thead>
        <tbody id="modelsBody"></tbody>
    </table>
</div>
{% endblock %}

{% block scripts %}
<script>
    const refreshBtn = document.getElementById("refreshBtn");
    const table = document.getElementById("modelsTable");
    const tbody = document.getElementById("modelsBody");
    const emptyHint = document.getElementById("emptyHint");
    const errorBox = document.getElementById("errorBox");

    refreshBtn.addEventListener("click", loadModels);
    loadModels();

    async function loadModels() {
        errorBox.hidden = true;
        try {
            const response = await fetch("/api/ml/models");
            const body = await response.json();
            if (!response.ok) {
                showError(body.error || "載入模型清單失敗");
                return;
            }
            renderModels(body.models || []);
        } catch (err) {
            showError("無法連線到伺服器：" + err.message);
        }
    }

    function renderModels(models) {
        tbody.innerHTML = "";
        if (models.length === 0) {
            table.hidden = true;
            emptyHint.hidden = false;
            return;
        }
        emptyHint.hidden = true;
        table.hidden = false;

        for (const model of models) {
            const tr = document.createElement("tr");
            tr.appendChild(cell(model.id));
            tr.appendChild(cell(model.algorithm));
            tr.appendChild(cell(formatNum(model.best_cv_score)));
            tr.appendChild(cell(formatNum((model.metrics || {}).accuracy)));
            tr.appendChild(cell(model.created_at));
            tr.appendChild(statusCell(model.is_active));
            tr.appendChild(actionCell(model));
            tbody.appendChild(tr);
        }
    }

    function cell(text) {
        const td = document.createElement("td");
        td.textContent = text === undefined || text === null ? "—" : text;
        return td;
    }

    function statusCell(isActive) {
        const td = document.createElement("td");
        td.textContent = isActive ? "active" : "—";
        td.className = isActive ? "ok" : "muted";
        return td;
    }

    function actionCell(model) {
        const td = document.createElement("td");
        const actions = document.createElement("div");
        actions.className = "actions";

        // 非 active 模型才提供「設為 active」
        if (!model.is_active) {
            const activateBtn = document.createElement("button");
            activateBtn.textContent = "設為 active";
            activateBtn.addEventListener("click", () => activate(model.id, activateBtn));
            actions.appendChild(activateBtn);
        }

        const deleteBtn = document.createElement("button");
        deleteBtn.textContent = "刪除";
        deleteBtn.className = "danger";
        deleteBtn.addEventListener("click", () => removeModel(model, deleteBtn));
        actions.appendChild(deleteBtn);

        td.appendChild(actions);
        return td;
    }

    async function activate(modelId, btn) {
        btn.disabled = true;
        try {
            const response = await fetch(`/api/ml/models/${modelId}/activate`, { method: "POST" });
            const body = await response.json();
            if (!response.ok) {
                showError(body.error || "切換 active 失敗");
                btn.disabled = false;
                return;
            }
            loadModels();
        } catch (err) {
            showError("無法連線到伺服器：" + err.message);
            btn.disabled = false;
        }
    }

    async function removeModel(model, btn) {
        const label = model.is_active ? "（這是目前 active 模型）" : "";
        if (!confirm(`確定要刪除模型 #${model.id} ${model.algorithm}？${label}`)) {
            return;
        }
        btn.disabled = true;
        try {
            const response = await fetch(`/api/ml/models/${model.id}`, { method: "DELETE" });
            const body = await response.json();
            if (!response.ok) {
                showError(body.error || "刪除模型失敗");
                btn.disabled = false;
                return;
            }
            loadModels();
        } catch (err) {
            showError("無法連線到伺服器：" + err.message);
            btn.disabled = false;
        }
    }

    function formatNum(value) {
        return typeof value === "number" ? value.toFixed(4) : "—";
    }

    function showError(message) {
        errorBox.hidden = false;
        errorBox.textContent = message;
    }
</script>
{% endblock %}
