{% extends "base.html" %}

{% block title %}新增乘客 — Titanic ML{% endblock %}

{% block content %}
<h1>新增乘客</h1>

<div class="card narrow">
    <form id="passengerForm">
        <div class="form-grid">
            <div class="field full">
                <label>Name <span class="zh">姓名</span></label>
                <div style="display:flex; gap:8px;">
                    <input name="Name" placeholder="例：Braund, Mr. Owen Harris" required style="flex:1;">
                    <button type="button" data-random="name" title="依目前 Sex 隨機產生姓名"
                        style="margin-top:0; background:var(--panel); color:var(--fg); display:inline-flex; align-items:center; gap:6px;">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="16 3 21 3 21 8" />
                            <line x1="4" y1="20" x2="21" y2="3" />
                            <polyline points="21 16 21 21 16 21" />
                            <line x1="15" y1="15" x2="21" y2="21" />
                            <line x1="4" y1="4" x2="9" y2="9" />
                        </svg>
                        隨機
                    </button>
                </div>
            </div>

            <div class="field">
                <label>Survived <span class="zh">是否生還</span></label>
                <select name="Survived" required>
                    <option value="0">0：未生還</option>
                    <option value="1">1：生還</option>
                </select>
            </div>

            <div class="field">
                <label>Pclass <span class="zh">艙等</span></label>
                <select name="Pclass" required>
                    <option value="1">1 等艙</option>
                    <option value="2">2 等艙</option>
                    <option value="3">3 等艙</option>
                </select>
            </div>

            <div class="field">
                <label>Sex <span class="zh">性別</span></label>
                <select name="Sex" required>
                    <option value="male">male</option>
                    <option value="female">female</option>
                </select>
            </div>

            <div class="field">
                <label>Embarked <span class="zh">登船港口</span></label>
                <select name="Embarked">
                    <option value="">未知</option>
                    <option value="C">C</option>
                    <option value="Q">Q</option>
                    <option value="S">S</option>
                </select>
            </div>

            <div class="field">
                <label>Age <span class="zh">年齡</span></label>
                <input name="Age" type="number" step="1" min="0" max="120" placeholder="例：22"
                    onkeydown="if (['.', 'e', 'E', '+', '-'].includes(event.key)) event.preventDefault();">
            </div>

            <div class="field">
                <label>Fare <span class="zh">票價</span></label>
                <input name="Fare" type="number" step="0.0001" min="0" value="0" required>
            </div>

            <div class="field">
                <label>SibSp <span class="zh">兄弟姊妹 / 配偶 (人)</span></label>
                <input name="SibSp" type="number" min="0" value="0" required>
            </div>

            <div class="field">
                <label>Parch <span class="zh">父母 / 子女 (人)</span></label>
                <input name="Parch" type="number" min="0" value="0" required>
            </div>

            <div class="field">
                <label>Ticket <span class="zh">票號</span></label>
                <div style="display:flex; gap:8px;">
                    <input name="Ticket" placeholder="例：A/5 21171" required style="flex:1;">
                    <button type="button" data-random="ticket" class="icon-btn" title="隨機產生票號">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="16 3 21 3 21 8" />
                            <line x1="4" y1="20" x2="21" y2="3" />
                            <polyline points="21 16 21 21 16 21" />
                            <line x1="15" y1="15" x2="21" y2="21" />
                            <line x1="4" y1="4" x2="9" y2="9" />
                        </svg>
                    </button>
                </div>
            </div>

            <div class="field">
                <label>Cabin <span class="zh">艙房</span></label>
                <div style="display:flex; gap:8px;">
                    <input name="Cabin" placeholder="例：C85" style="flex:1;">
                    <button type="button" data-random="cabin" class="icon-btn" title="隨機產生艙房">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="16 3 21 3 21 8" />
                            <line x1="4" y1="20" x2="21" y2="3" />
                            <polyline points="21 16 21 21 16 21" />
                            <line x1="15" y1="15" x2="21" y2="21" />
                            <line x1="4" y1="4" x2="9" y2="9" />
                        </svg>
                    </button>
                </div>
            </div>

            <div class="field full">
                <button type="submit" class="btn-block">Add Passenger</button>
            </div>
        </div>
    </form>

    <p style="text-align:center; margin-top:14px;">
        <a href="/passengers" class="muted">取消，回乘客列表</a>
    </p>
</div>
{% endblock %}

{% block scripts %}
<!-- 隨機產生（姓名/票號/艙房）：與生存預測頁共用 -->
<script src="{{ url_for('static', filename='passenger-random.js') }}"></script>
<script>
    // 監聽 passengerForm 的 submit 事件，當表單被提交時，會觸發這個事件處理器。
    document.getElementById("passengerForm").addEventListener("submit", async function (event) {
        // 阻止表單的預設提交行為
        event.preventDefault();

        // 取得表單元素，並使用 FormData 物件來收集表單資料
        const form = event.target;
        const formData = new FormData(form);

        // 將 FormData 物件轉換成一般的 JavaScript 物件，
        // 這樣我們就可以把它轉成 JSON 格式
        const data = Object.fromEntries(formData.entries());

        // 請求新增乘客
        const response = await fetch("/api/passengers", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(data)
        });

        // 取得回應
        const result = await response.json();

        // 如果新增失敗，會取得 error 屬性，顯示錯誤訊息給使用者
        if (!response.ok) {
            alert(result.error);
            return;
        }

        alert("新增成功");

        // 新增成功後，回到乘客列表
        window.location.href = "/passengers";
    });
</script>
{% endblock %}
